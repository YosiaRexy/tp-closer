# fly.toml - Fly.io configuration
app = "tp-closer"
primary_region = "sin"  # Singapore (terdekat Batam)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  POLL_INTERVAL_SEC = "15"
  BYBIT_TESTNET = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "tp_data"
  destination = "/data"